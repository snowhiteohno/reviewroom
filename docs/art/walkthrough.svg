<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Try a review together</title>
  <desc id="desc">Use two browser profiles. 1. Designer: Create a project and upload. 2. Designer: Share with the reviewer’s email. 3. Reviewer: Pin a Must fix on the design. 4. Designer: Upload v2, then Fixes › Link a fix. 5. Designer: Request review; Approve stays off. 6. Reviewer: Verify the fix and approve. 7. Designer: Compare › Reveal, Votes › blind vote. The sample Flora project already has two revisions, an addressed fix and a vote.</desc>
  <defs>
    <style>
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
      .sans { font-family: "Avenir Next", Avenir, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#c9a6ae" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="1160" height="370" rx="28" fill="#faf8f4" stroke="#e9e3db" stroke-width="2"/>
  <text x="60" y="88" class="serif" font-size="36" fill="#443c38">Try a review together<tspan fill="#a85968">.</tspan></text>
  <text x="60" y="120" class="sans" font-size="16" fill="#8a817a">Two browser profiles, a designer and a reviewer. Short on time? The sample Flora project has it all.</text>
  <rect x="60" y="150" width="1080" height="100" rx="18" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <rect x="60" y="266" width="1080" height="100" rx="18" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <text x="84" y="205" class="sans" font-size="11" fill="#a85968" font-weight="700" letter-spacing="2">DESIGNER</text>
  <text x="84" y="321" class="sans" font-size="11" fill="#647960" font-weight="700" letter-spacing="2">REVIEWER</text>
  <path d="M240 224 L378 224 L516 290 L654 224 L792 224 L930 290 L1068 224" fill="none" stroke="#c9a6ae" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="240" cy="224" r="15" fill="#a85968" stroke="#fffefa" stroke-width="3"/>
  <text x="240" y="229" class="sans" font-size="14" fill="#fffefa" font-weight="700" text-anchor="middle">1</text>
  <text x="240" y="180" class="sans" font-size="13" fill="#443c38" text-anchor="middle">Create a project</text>
  <text x="240" y="198" class="sans" font-size="13" fill="#8a817a" text-anchor="middle">and upload</text>
  <circle cx="378" cy="224" r="15" fill="#a85968" stroke="#fffefa" stroke-width="3"/>
  <text x="378" y="229" class="sans" font-size="14" fill="#fffefa" font-weight="700" text-anchor="middle">2</text>
  <text x="378" y="180" class="sans" font-size="13" fill="#443c38" text-anchor="middle">Share with the</text>
  <text x="378" y="198" class="sans" font-size="13" fill="#8a817a" text-anchor="middle">reviewer’s email</text>
  <circle cx="516" cy="290" r="15" fill="#647960" stroke="#fffefa" stroke-width="3"/>
  <text x="516" y="295" class="sans" font-size="14" fill="#fffefa" font-weight="700" text-anchor="middle">3</text>
  <text x="516" y="326" class="sans" font-size="13" fill="#443c38" text-anchor="middle">Pin a Must fix</text>
  <text x="516" y="344" class="sans" font-size="13" fill="#8a817a" text-anchor="middle">on the design</text>
  <circle cx="654" cy="224" r="15" fill="#a85968" stroke="#fffefa" stroke-width="3"/>
  <text x="654" y="229" class="sans" font-size="14" fill="#fffefa" font-weight="700" text-anchor="middle">4</text>
  <text x="654" y="180" class="sans" font-size="13" fill="#443c38" text-anchor="middle">Upload v2, then</text>
  <text x="654" y="198" class="sans" font-size="13" fill="#8a817a" text-anchor="middle">Fixes › Link a fix</text>
  <circle cx="792" cy="224" r="15" fill="#a85968" stroke="#fffefa" stroke-width="3"/>
  <text x="792" y="229" class="sans" font-size="14" fill="#fffefa" font-weight="700" text-anchor="middle">5</text>
  <text x="792" y="180" class="sans" font-size="13" fill="#443c38" text-anchor="middle">Request review;</text>
  <text x="792" y="198" class="sans" font-size="13" fill="#8a817a" text-anchor="middle">Approve stays off</text>
  <circle cx="930" cy="290" r="15" fill="#647960" stroke="#fffefa" stroke-width="3"/>
  <text x="930" y="295" class="sans" font-size="14" fill="#fffefa" font-weight="700" text-anchor="middle">6</text>
  <text x="930" y="326" class="sans" font-size="13" fill="#443c38" text-anchor="middle">Verify the fix</text>
  <text x="930" y="344" class="sans" font-size="13" fill="#8a817a" text-anchor="middle">and approve</text>
  <circle cx="1068" cy="224" r="15" fill="#a85968" stroke="#fffefa" stroke-width="3"/>
  <text x="1068" y="229" class="sans" font-size="14" fill="#fffefa" font-weight="700" text-anchor="middle">7</text>
  <text x="1068" y="180" class="sans" font-size="13" fill="#443c38" text-anchor="middle">Compare › Reveal,</text>
  <text x="1068" y="198" class="sans" font-size="13" fill="#8a817a" text-anchor="middle">Votes › blind vote</text>
</svg>
