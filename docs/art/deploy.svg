<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Deploy</title>
  <desc id="desc">1 · MONGODB ATLAS: Make a database. Free cluster, read and write user Allow Render’s IPs, or anywhere with a strong password Copy the URI, add /reviewroom. 2 · RENDER BLUEPRINT: Paste one secret. Paste the URI as MONGODB_URI Keep it in Render, never in Git JWT_SECRET is generated for you Ready when /api/health is green. 3 · LIVE: Open and register. RENDER_EXTERNAL_URL is read itself Set APP_ORIGIN for a custom domain TRUST_PROXY_HOPS=1 for the proxy Free plan sleeps; first visit is slow. Anywhere else, set: MONGODB_URI: Required. Atlas or any MongoDB replica set. APP_ORIGIN: Required. Must be HTTPS, because production auth cookies need it. JWT_SECRET: Required. At least 32 random characters. UPLOAD_STORAGE: gridfs by default in production, so images survive redeploys; filesystem in development. UPLOAD_DIR: Filesystem storage only: a persistent folder outside public static files. TRUST_PROXY_HOPS: 1 behind one trusted proxy such as Render; 0 when Node is served directly. The Docker image runs as an unprivileged user with a database-aware health check and holds no credentials or secrets.</desc>
  <defs>
    <style>
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
      .sans { font-family: "Avenir Next", Avenir, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#c9a6ae" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="1160" height="660" rx="28" fill="#faf8f4" stroke="#e9e3db" stroke-width="2"/>
  <text x="60" y="88" class="serif" font-size="36" fill="#443c38">Ship it on Render<tspan fill="#a85968">.</tspan></text>
  <text x="60" y="120" class="sans" font-size="16" fill="#8a817a">The live app runs from render.yaml on Render’s free plan, with MongoDB Atlas behind it.</text>
  <rect x="60" y="150" width="340" height="196" rx="16" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <text x="84" y="182" class="sans" font-size="11" fill="#a85968" font-weight="700" letter-spacing="2">1 · MONGODB ATLAS</text>
  <text x="84" y="214" class="serif" font-size="22" fill="#443c38">Make a database</text>
  <text x="84" y="246" class="sans" font-size="14" fill="#443c38">Free cluster, read and write user</text>
  <text x="84" y="270" class="sans" font-size="14" fill="#443c38">Allow Render’s IPs, or anywhere</text>
  <text x="84" y="294" class="sans" font-size="14" fill="#443c38">with a strong password</text>
  <text x="84" y="318" class="sans" font-size="14" fill="#443c38">Copy the URI, add /reviewroom</text>
  <line x1="404" y1="248" x2="426" y2="248" stroke="#c9a6ae" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="430" y="150" width="340" height="196" rx="16" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <text x="454" y="182" class="sans" font-size="11" fill="#a85968" font-weight="700" letter-spacing="2">2 · RENDER BLUEPRINT</text>
  <text x="454" y="214" class="serif" font-size="22" fill="#443c38">Paste one secret</text>
  <text x="454" y="246" class="sans" font-size="14" fill="#443c38">Paste the URI as MONGODB_URI</text>
  <text x="454" y="270" class="sans" font-size="14" fill="#443c38">Keep it in Render, never in Git</text>
  <text x="454" y="294" class="sans" font-size="14" fill="#443c38">JWT_SECRET is generated for you</text>
  <text x="454" y="318" class="sans" font-size="14" fill="#443c38">Ready when /api/health is green</text>
  <line x1="774" y1="248" x2="796" y2="248" stroke="#c9a6ae" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="800" y="150" width="340" height="196" rx="16" fill="#e7ecdf" stroke="#647960" stroke-width="2"/>
  <text x="824" y="182" class="sans" font-size="11" fill="#647960" font-weight="700" letter-spacing="2">3 · LIVE</text>
  <text x="824" y="214" class="serif" font-size="22" fill="#443c38">Open and register</text>
  <text x="824" y="246" class="sans" font-size="14" fill="#5b6b57">RENDER_EXTERNAL_URL is read itself</text>
  <text x="824" y="270" class="sans" font-size="14" fill="#5b6b57">Set APP_ORIGIN for a custom domain</text>
  <text x="824" y="294" class="sans" font-size="14" fill="#5b6b57">TRUST_PROXY_HOPS=1 for the proxy</text>
  <text x="824" y="318" class="sans" font-size="14" fill="#5b6b57">Free plan sleeps; first visit is slow</text>
  <rect x="60" y="370" width="1080" height="290" rx="16" fill="#f5f1eb"/>
  <text x="84" y="402" class="sans" font-size="11" fill="#8a817a" font-weight="700" letter-spacing="2">ANYWHERE ELSE  ·  SET THESE IN THE HOST</text>
  <text x="84" y="438" class="mono" font-size="14" fill="#a85968">MONGODB_URI</text>
  <text x="260" y="438" class="sans" font-size="14" fill="#443c38">Required. Atlas or any MongoDB replica set.</text>
  <text x="84" y="466" class="mono" font-size="14" fill="#a85968">APP_ORIGIN</text>
  <text x="260" y="466" class="sans" font-size="14" fill="#443c38">Required. Must be HTTPS, because production auth cookies need it.</text>
  <text x="84" y="494" class="mono" font-size="14" fill="#a85968">JWT_SECRET</text>
  <text x="260" y="494" class="sans" font-size="14" fill="#443c38">Required. At least 32 random characters.</text>
  <text x="84" y="522" class="mono" font-size="14" fill="#a85968">UPLOAD_STORAGE</text>
  <text x="260" y="522" class="sans" font-size="14" fill="#443c38">gridfs by default in production, so images survive redeploys; filesystem in development.</text>
  <text x="84" y="550" class="mono" font-size="14" fill="#a85968">UPLOAD_DIR</text>
  <text x="260" y="550" class="sans" font-size="14" fill="#443c38">Filesystem storage only: a persistent folder outside public static files.</text>
  <text x="84" y="578" class="mono" font-size="14" fill="#a85968">TRUST_PROXY_HOPS</text>
  <text x="260" y="578" class="sans" font-size="14" fill="#443c38">1 behind one trusted proxy such as Render; 0 when Node is served directly.</text>
  <line x1="84" y1="600" x2="1116" y2="600" stroke="#e9e3db" stroke-width="1"/>
  <text x="84" y="632" class="sans" font-size="13" fill="#8a817a">Docker: the image runs as an unprivileged user, has a database-aware health check, and holds no credentials or secrets.</text>
</svg>
