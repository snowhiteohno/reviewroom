<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Also included</title>
  <desc id="desc">Accounts with bcrypt and HttpOnly JWT sessions; protected routes and owner, editor, reviewer roles; private image uploads with size, format and dimension checks and safe version numbering; pinned comments, threaded replies, resolved threads and side by side compare; studio categories, search, filters, favorites, grid and list views, archiving and live activity; loading, error and empty states, native dialogs and reduced motion. Stack: React 19, TypeScript, Vite, React Router, Express 5, Node.js, MongoDB, Mongoose, GridFS, bcrypt, jsonwebtoken, Zod, Multer, Sharp, Node test runner, Supertest and Playwright.</desc>
  <defs>
    <style>
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
      .sans { font-family: "Avenir Next", Avenir, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#c9a6ae" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="1160" height="560" rx="28" fill="#faf8f4" stroke="#e9e3db" stroke-width="2"/>
  <text x="60" y="88" class="serif" font-size="36" fill="#443c38">Also included<tspan fill="#a85968">.</tspan></text>
  <text x="60" y="120" class="sans" font-size="16" fill="#8a817a">Each new account starts with a labeled sample studio, drawn as original SVG and created only once.</text>
  <rect x="60" y="152" width="346" height="140" rx="16" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <text x="84" y="188" class="sans" font-size="11" fill="#a85968" font-weight="700" letter-spacing="2">ACCOUNTS</text>
  <text x="84" y="218" class="sans" font-size="14" fill="#443c38">Register, log in, log out</text>
  <text x="84" y="242" class="sans" font-size="14" fill="#443c38">Persistent, revocable sessions</text>
  <text x="84" y="266" class="sans" font-size="14" fill="#443c38">bcrypt hashes, JWT in HttpOnly cookie</text>
  <rect x="427" y="152" width="346" height="140" rx="16" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <text x="451" y="188" class="sans" font-size="11" fill="#a85968" font-weight="700" letter-spacing="2">ACCESS</text>
  <text x="451" y="218" class="sans" font-size="14" fill="#443c38">Protected routes</text>
  <text x="451" y="242" class="sans" font-size="14" fill="#443c38">Project membership</text>
  <text x="451" y="266" class="sans" font-size="14" fill="#443c38">Owner, editor and reviewer roles</text>
  <rect x="794" y="152" width="346" height="140" rx="16" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <text x="818" y="188" class="sans" font-size="11" fill="#647960" font-weight="700" letter-spacing="2">UPLOADS</text>
  <text x="818" y="218" class="sans" font-size="14" fill="#443c38">Private images only</text>
  <text x="818" y="242" class="sans" font-size="14" fill="#443c38">Size, format and dimension checks</text>
  <text x="818" y="266" class="sans" font-size="14" fill="#443c38">Version numbers safe under concurrency</text>
  <rect x="60" y="308" width="346" height="140" rx="16" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <text x="84" y="344" class="sans" font-size="11" fill="#647960" font-weight="700" letter-spacing="2">FEEDBACK</text>
  <text x="84" y="374" class="sans" font-size="14" fill="#443c38">Pins stay aligned through zoom</text>
  <text x="84" y="398" class="sans" font-size="14" fill="#443c38">Threaded replies, resolved threads</text>
  <text x="84" y="422" class="sans" font-size="14" fill="#443c38">Side by side compare</text>
