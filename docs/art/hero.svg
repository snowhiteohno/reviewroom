<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">ReviewRoom</title>
  <desc id="desc">ReviewRoom, a thoughtful space for designs, feedback, and the next version. A design card carries a pinned must fix comment that was fixed in version 2 and verified by a reviewer.</desc>
  <defs>
    <style>
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
      .sans { font-family: "Avenir Next", Avenir, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
    <symbol id="flower" viewBox="-20 -20 40 58" overflow="visible">
      <g fill="none" stroke="#a85968" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="-6.5" cy="-6.5" rx="5.5" ry="8.5" transform="rotate(-45 -6.5 -6.5)"/>
        <ellipse cx="6.5" cy="-6.5" rx="5.5" ry="8.5" transform="rotate(45 6.5 -6.5)"/>
        <ellipse cx="-6.5" cy="6.5" rx="5.5" ry="8.5" transform="rotate(45 -6.5 6.5)"/>
        <ellipse cx="6.5" cy="6.5" rx="5.5" ry="8.5" transform="rotate(-45 6.5 6.5)"/>
        <circle r="3.2"/>
        <path d="M0 15V37M0 29C-6 24-12 25-15 30C-9 33-4 32 0 29M0 29C6 24 12 25 15 30C9 33 4 32 0 29"/>
      </g>
    </symbol>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#443c38" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="1240" height="520" rx="28" fill="#faf8f4" stroke="#e9e3db" stroke-width="2"/>

  <!-- wordmark -->
  <use href="#flower" x="80" y="118" width="20" height="29"/>
  <text x="110" y="138" class="sans" font-size="13" font-weight="600" letter-spacing="3" fill="#a85968">DESIGN REVIEW STUDIO</text>
  <text x="76" y="248" class="serif" font-size="96" fill="#443c38">reviewroom<tspan fill="#a85968">.</tspan></text>
  <text x="80" y="300" class="sans" font-size="22" fill="#8a817a">A thoughtful space for designs,</text>
  <text x="80" y="332" class="sans" font-size="22" fill="#8a817a">feedback, and the next version.</text>

  <g class="sans" font-size="15" font-weight="600" text-anchor="middle">
    <rect x="80" y="370" width="128" height="36" rx="18" fill="#f2e4e5"/>
    <text x="144" y="393" fill="#a85968">Pin feedback</text>
    <rect x="220" y="370" width="128" height="36" rx="18" fill="#e7ecdf"/>
    <text x="284" y="393" fill="#647960">Verify fixes</text>
    <rect x="360" y="370" width="116" height="36" rx="18" fill="#eae4ef"/>
    <text x="418" y="393" fill="#6f5a80">Vote blind</text>
  </g>

  <line x1="80" y1="452" x2="600" y2="452" stroke="#e9e3db" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <text x="80" y="494" class="sans" font-size="15" fill="#8a817a" letter-spacing="0.5">MongoDB · Express · React · Node.js</text>

  <!-- design card -->
  <g transform="translate(690 70) rotate(-2.5)">
    <rect width="470" height="400" rx="20" fill="#fffefa" stroke="#e9e3db" stroke-width="2" filter="url(#lift)"/>
    <rect x="18" y="18" width="434" height="262" rx="12" fill="#e7ecdf"/>

    <g transform="rotate(-4 150 150)">
      <rect x="50" y="44" width="196" height="220" rx="4" fill="#fffefa"/>
      <text x="82" y="112" class="serif" font-size="50" fill="#443c38">flora</text>
      <text x="86" y="134" class="sans" font-size="9" letter-spacing="3" fill="#8a817a">FLOWER STUDIO</text>
      <path d="M150 250C146 220 152 190 148 156" fill="none" stroke="#647960" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="136" cy="214" rx="13" ry="6" transform="rotate(-30 136 214)" fill="#647960"/>
      <ellipse cx="164" cy="190" rx="13" ry="6" transform="rotate(30 164 190)" fill="#647960"/>
      <ellipse cx="136" cy="174" rx="11" ry="5" transform="rotate(-30 136 174)" fill="#647960"/>
    </g>

    <g transform="rotate(5 335 155)">
      <rect x="252" y="70" width="168" height="168" rx="4" fill="#8f4f63"/>
      <g fill="#f7e8e4">
        <ellipse cx="336" cy="126" rx="16" ry="27"/>
        <ellipse cx="336" cy="126" rx="16" ry="27" transform="rotate(72 336 152)"/>
        <ellipse cx="336" cy="126" rx="16" ry="27" transform="rotate(144 336 152)"/>
        <ellipse cx="336" cy="126" rx="16" ry="27" transform="rotate(216 336 152)"/>
        <ellipse cx="336" cy="126" rx="16" ry="27" transform="rotate(288 336 152)"/>
      </g>
      <circle cx="336" cy="152" r="11" fill="#c96f72"/>
    </g>

    <!-- pins -->
    <circle cx="300" cy="112" r="19" fill="#fffefa"/>
    <circle cx="300" cy="112" r="15" fill="#a85968"/>
    <text x="300" y="118" class="sans" font-size="16" font-weight="700" fill="#fffefa" text-anchor="middle">1</text>
    <circle cx="112" cy="232" r="19" fill="#fffefa"/>
    <circle cx="112" cy="232" r="15" fill="#647960"/>
    <text x="112" y="238" class="sans" font-size="16" font-weight="700" fill="#fffefa" text-anchor="middle">2</text>

    <text x="26" y="334" class="serif" font-size="28" fill="#443c38">Flora studio</text>
    <text x="26" y="362" class="sans" font-size="15" fill="#8a817a">Version 2 · In review</text>
    <rect x="300" y="320" width="146" height="30" rx="15" fill="#e7ecdf"/>
    <text x="373" y="340" class="sans" font-size="13" font-weight="600" fill="#647960" text-anchor="middle">1 of 1 fix verified</text>
  </g>

  <!-- must fix comment -->
  <g filter="url(#lift)">
    <path d="M1040 140L1006 162L1050 150Z" fill="#fffefa" stroke="#e9e3db" stroke-width="2" stroke-linejoin="round"/>
    <rect x="1030" y="56" width="214" height="98" rx="16" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
    <rect x="1040" y="146" width="30" height="10" fill="#fffefa"/>
  </g>
  <rect x="1048" y="72" width="76" height="22" rx="11" fill="#f2e4e5"/>
  <text x="1086" y="87" class="sans" font-size="11" font-weight="700" letter-spacing="1" fill="#a85968" text-anchor="middle">MUST FIX</text>
  <text x="1048" y="118" class="serif" font-size="18" fill="#443c38">Give the logo more</text>
  <text x="1048" y="140" class="serif" font-size="18" fill="#443c38">breathing room.</text>

  <!-- verified -->
  <g filter="url(#lift)">
    <rect x="1036" y="418" width="214" height="78" rx="16" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  </g>
  <circle cx="1066" cy="457" r="14" fill="#e7ecdf"/>
  <path d="M1059 457L1064 462L1073 452" fill="none" stroke="#647960" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1090" y="451" class="serif" font-size="17" fill="#443c38">Fixed in version 2</text>
  <text x="1090" y="474" class="sans" font-size="13" fill="#8a817a">Verified by a reviewer</text>
</svg>
