<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">What npm run dev starts</title>
  <desc id="desc">Needs Node.js 22.13 or newer and no paid or AI API keys. The browser opens localhost:5174, where Vite serves the React client and proxies /api to Express on 127.0.0.1:5180 so cookies stay on one origin. With MONGODB_URI empty, a local replica set starts on port 27019 with data in .data/mongo; it reuses its own running instance and leaves other MongoDB services alone. With MONGODB_URI set in .env (copied from .env.example), Atlas or any replica set is used; a standalone mongod fails because ReviewRoom needs transactions. The git-ignored .data folder holds mongo, uploads, session-secret and mongod.log and survives restarts.</desc>
  <defs>
    <style>
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
      .sans { font-family: "Avenir Next", Avenir, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#c9a6ae" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="1160" height="400" rx="28" fill="#faf8f4" stroke="#e9e3db" stroke-width="2"/>
  <text x="60" y="88" class="serif" font-size="36" fill="#443c38">What npm run dev starts<tspan fill="#a85968">.</tspan></text>
  <text x="60" y="120" class="sans" font-size="16" fill="#8a817a">Node.js 22.13+, no paid or AI keys, no preset accounts: open localhost:5174 and register.</text>
  <line x1="262" y1="200" x2="296" y2="200" stroke="#c9a6ae" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="522" y1="200" x2="556" y2="200" stroke="#c9a6ae" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="60" y="150" width="200" height="100" rx="16" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <text x="80" y="180" class="sans" font-size="11" fill="#a85968" font-weight="700" letter-spacing="2">BROWSER</text>
  <text x="80" y="210" class="mono" font-size="15" fill="#443c38">localhost:5174</text>
  <text x="80" y="234" class="sans" font-size="13" fill="#8a817a">where you sign in</text>
  <rect x="300" y="150" width="220" height="100" rx="16" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <text x="320" y="180" class="sans" font-size="11" fill="#a85968" font-weight="700" letter-spacing="2">VITE</text>
  <text x="320" y="208" class="serif" font-size="19" fill="#443c38">React client</text>
  <text x="320" y="234" class="sans" font-size="13" fill="#8a817a">proxies /api on one origin</text>
  <rect x="560" y="150" width="200" height="100" rx="16" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <text x="580" y="180" class="sans" font-size="11" fill="#a85968" font-weight="700" letter-spacing="2">EXPRESS</text>
  <text x="580" y="210" class="mono" font-size="15" fill="#443c38">127.0.0.1:5180</text>
  <text x="580" y="234" class="sans" font-size="13" fill="#8a817a">API, auth, uploads</text>
  <path d="M660 252V270H230V286M660 270H600V286" fill="none" stroke="#c9a6ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M224 281L230 288L236 281M594 281L600 288L606 281" fill="none" stroke="#c9a6ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="60" y="290" width="340" height="110" rx="16" fill="#e7ecdf" stroke="#647960" stroke-width="2"/>
  <text x="80" y="318" class="sans" font-size="11" fill="#647960" font-weight="700" letter-spacing="2">MONGODB_URI EMPTY</text>
  <text x="80" y="346" class="serif" font-size="19" fill="#443c38">Local replica set</text>
  <text x="80" y="368" class="sans" font-size="13" fill="#5b6b57">port 27019, data in .data/mongo</text>
  <text x="80" y="386" class="sans" font-size="13" fill="#5b6b57">reuses its own, leaves others alone</text>
  <rect x="420" y="290" width="360" height="110" rx="16" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <text x="440" y="318" class="sans" font-size="11" fill="#a85968" font-weight="700" letter-spacing="2">MONGODB_URI SET</text>
  <text x="440" y="346" class="serif" font-size="19" fill="#443c38">Atlas or any replica set</text>
  <text x="440" y="368" class="sans" font-size="13" fill="#8a817a">copy .env.example to .env</text>
  <text x="440" y="386" class="sans" font-size="13" fill="#8a817a">standalone mongod fails: needs transactions</text>
  <rect x="800" y="150" width="340" height="250" rx="16" fill="#f5f1eb"/>
  <text x="824" y="180" class="sans" font-size="11" fill="#8a817a" font-weight="700" letter-spacing="2">.DATA/  ·  GIT-IGNORED</text>
  <text x="824" y="222" class="mono" font-size="14" fill="#443c38">mongo/</text>
  <text x="1000" y="222" class="sans" font-size="13" fill="#8a817a">local database</text>
  <text x="824" y="256" class="mono" font-size="14" fill="#443c38">uploads/</text>
  <text x="1000" y="256" class="sans" font-size="13" fill="#8a817a">private images</text>
  <text x="824" y="290" class="mono" font-size="14" fill="#443c38">session-secret</text>
  <text x="1000" y="290" class="sans" font-size="13" fill="#8a817a">dev signing key</text>
  <text x="824" y="324" class="mono" font-size="14" fill="#443c38">mongod.log</text>
  <text x="1000" y="324" class="sans" font-size="13" fill="#8a817a">database logs</text>
  <text x="824" y="370" class="sans" font-size="13" fill="#8a817a">Survives restarts. .env files and test</text>
  <text x="824" y="388" class="sans" font-size="13" fill="#8a817a">artifacts are ignored by Git too.</text>
</svg>
