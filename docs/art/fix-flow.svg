<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Feedback to fix</title>
  <desc id="desc">A reviewer pins a must fix on version 1. The designer uploads version 2 and links it to the comment. A different reviewer verifies the fix. Approval stays disabled while any must fix is open, enforced inside a MongoDB transaction.</desc>
  <defs>
    <style>
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
      .sans { font-family: "Avenir Next", Avenir, "Segoe UI", Helvetica, Arial, sans-serif; }
      .step { font-size: 11px; font-weight: 700; letter-spacing: 2px; fill: #8a817a; }
      .head { font-size: 23px; fill: #443c38; }
      .body { font-size: 14px; fill: #8a817a; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#c9a6ae" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1160" height="380" rx="28" fill="#faf8f4" stroke="#e9e3db" stroke-width="2"/>

  <text x="60" y="88" class="serif" font-size="36" fill="#443c38">From feedback to a verified fix<tspan fill="#a85968">.</tspan></text>
  <text x="60" y="120" class="sans" font-size="16" fill="#8a817a">Feedback is a suggestion or a must fix. A must fix follows the design until someone else signs off.</text>

  <g stroke="#c9a6ae" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round" marker-end="url(#arrow)">
    <line x1="306" y1="238" x2="334" y2="238"/>
    <line x1="580" y1="238" x2="608" y2="238"/>
    <line x1="854" y1="238" x2="882" y2="238"/>
  </g>

  <!-- 1 -->
  <rect x="60" y="160" width="240" height="156" rx="18" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <circle cx="96" cy="196" r="18" fill="#f2e4e5"/>
  <circle cx="96" cy="196" r="9" fill="#a85968"/>
  <text x="124" y="200" class="sans step">1 · REVIEWER</text>
  <text x="84" y="252" class="serif head">Pins a must fix</text>
  <text x="84" y="278" class="sans body">On the exact spot,</text>
  <text x="84" y="297" class="sans body">in version 1.</text>

  <!-- 2 -->
  <rect x="334" y="160" width="240" height="156" rx="18" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <circle cx="370" cy="196" r="18" fill="#e7ecdf"/>
  <g fill="none" stroke="#647960" stroke-width="2" stroke-linejoin="round">
    <rect x="361" y="191" width="14" height="12" rx="2"/>
    <path d="M365 191V187H379V199H375"/>
  </g>
  <text x="398" y="200" class="sans step">2 · DESIGNER</text>
  <text x="358" y="252" class="serif head">Uploads a revision</text>
  <text x="358" y="278" class="sans body">Version 2 arrives with</text>
  <text x="358" y="297" class="sans body">safe numbering.</text>

  <!-- 3 -->
  <rect x="608" y="160" width="240" height="156" rx="18" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <circle cx="644" cy="196" r="18" fill="#f2e4e5"/>
  <g fill="none" stroke="#a85968" stroke-width="2.2" stroke-linecap="round">
    <path d="M641 199L647 193"/>
    <path d="M643 190L645 188A4 4 0 0 1 651 194L649 196"/>
    <path d="M645 202L643 204A4 4 0 0 1 637 198L639 196"/>
  </g>
  <text x="672" y="200" class="sans step">3 · DESIGNER</text>
  <text x="632" y="252" class="serif head">Links the fix</text>
  <text x="632" y="278" class="sans body">Points the comment</text>
  <text x="632" y="297" class="sans body">at version 2.</text>

  <!-- 4 -->
  <rect x="882" y="160" width="258" height="156" rx="18" fill="#fffefa" stroke="#647960" stroke-width="2"/>
  <circle cx="918" cy="196" r="18" fill="#e7ecdf"/>
  <path d="M911 196L916 201L925 191" fill="none" stroke="#647960" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="946" y="200" class="sans step">4 · ANOTHER REVIEWER</text>
  <text x="906" y="252" class="serif head">Verifies it</text>
  <text x="906" y="278" class="sans body">Nobody can verify</text>
  <text x="906" y="297" class="sans body">their own fix.</text>

  <!-- approval gate -->
  <rect x="60" y="338" width="1080" height="40" rx="20" fill="#f5f1eb"/>
  <g fill="none" stroke="#a85968" stroke-width="2" stroke-linecap="round">
    <rect x="83" y="355" width="14" height="11" rx="2"/>
    <path d="M86 355V351A4 4 0 0 1 94 351V355"/>
  </g>
  <text x="110" y="364" class="sans" font-size="14" fill="#443c38">Approve stays disabled while any must fix is open. The server enforces it inside a MongoDB transaction.</text>
</svg>
