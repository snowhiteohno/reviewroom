<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Blind design voting</title>
  <desc id="desc">Before you vote, the counts for versions 1, 2 and 3 are hidden. After you vote, the results appear: version 2 has 5 votes, version 1 has 2, and version 3 has 1. One vote per account, protected by a compound unique index and counted with an aggregation pipeline.</desc>
  <defs>
    <style>
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
      .sans { font-family: "Avenir Next", Avenir, "Segoe UI", Helvetica, Arial, sans-serif; }
      .label { font-size: 11px; font-weight: 700; letter-spacing: 2px; }
      .opt { font-size: 19px; fill: #443c38; }
    </style>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f2ecf3"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d9cfe0" stroke-width="3"/>
    </pattern>
  </defs>

  <rect x="20" y="20" width="1160" height="400" rx="28" fill="#faf8f4" stroke="#e9e3db" stroke-width="2"/>

  <text x="60" y="88" class="serif" font-size="36" fill="#443c38">Vote first, then see the room<tspan fill="#a85968">.</tspan></text>
  <text x="60" y="120" class="sans" font-size="16" fill="#8a817a">Counts stay hidden until you vote or the poll closes, even for owners and editors.</text>

  <!-- before -->
  <rect x="60" y="152" width="520" height="216" rx="18" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <text x="88" y="186" class="sans label" fill="#8a817a">BEFORE YOU VOTE</text>
  <g fill="none" stroke="#8a817a" stroke-width="1.8" stroke-linecap="round">
    <rect x="537" y="177" width="13" height="10" rx="2"/>
    <path d="M540 177V174A3.5 3.5 0 0 1 547 174V177"/>
  </g>

  <rect x="88" y="208" width="40" height="40" rx="8" fill="#f2e4e5"/>
  <text x="144" y="235" class="serif opt">Version 1</text>
  <rect x="270" y="222" width="244" height="12" rx="6" fill="url(#hatch)"/>
  <text x="548" y="234" class="sans" font-size="16" fill="#c4bcb4" text-anchor="end">?</text>

  <rect x="88" y="260" width="40" height="40" rx="8" fill="#e7ecdf"/>
  <text x="144" y="287" class="serif opt">Version 2</text>
  <rect x="270" y="274" width="244" height="12" rx="6" fill="url(#hatch)"/>
  <text x="548" y="286" class="sans" font-size="16" fill="#c4bcb4" text-anchor="end">?</text>

  <rect x="88" y="312" width="40" height="40" rx="8" fill="#eae4ef"/>
  <text x="144" y="339" class="serif opt">Version 3</text>
  <rect x="270" y="326" width="244" height="12" rx="6" fill="url(#hatch)"/>
  <text x="548" y="338" class="sans" font-size="16" fill="#c4bcb4" text-anchor="end">?</text>

  <!-- arrow -->
  <path d="M590 260H610" stroke="#c9a6ae" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"/>
  <path d="M604 254L611 260L604 266" fill="none" stroke="#c9a6ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- after -->
  <rect x="620" y="152" width="520" height="216" rx="18" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <text x="648" y="186" class="sans label" fill="#647960">AFTER YOU VOTE</text>
  <text x="1112" y="186" class="sans" font-size="12" fill="#8a817a" text-anchor="end">8 votes</text>

  <rect x="648" y="208" width="40" height="40" rx="8" fill="#f2e4e5"/>
  <text x="704" y="235" class="serif opt">Version 1</text>
  <rect x="830" y="222" width="244" height="12" rx="6" fill="#f3efe9"/>
  <rect x="830" y="222" width="98" height="12" rx="6" fill="#d7a9b3"/>
  <text x="1108" y="234" class="sans" font-size="16" font-weight="600" fill="#443c38" text-anchor="end">2</text>

  <rect x="648" y="260" width="40" height="40" rx="8" fill="#e7ecdf" stroke="#647960" stroke-width="2"/>
  <path d="M661 280L666 285L675 275" fill="none" stroke="#647960" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="704" y="282" class="serif opt">Version 2</text>
  <text x="704" y="299" class="sans" font-size="11" font-weight="700" letter-spacing="1.5" fill="#647960">YOUR VOTE</text>
  <rect x="830" y="274" width="244" height="12" rx="6" fill="#f3efe9"/>
  <rect x="830" y="274" width="244" height="12" rx="6" fill="#647960"/>
  <text x="1108" y="286" class="sans" font-size="16" font-weight="600" fill="#443c38" text-anchor="end">5</text>

  <rect x="648" y="312" width="40" height="40" rx="8" fill="#eae4ef"/>
  <text x="704" y="339" class="serif opt">Version 3</text>
  <rect x="830" y="326" width="244" height="12" rx="6" fill="#f3efe9"/>
  <rect x="830" y="326" width="49" height="12" rx="6" fill="#bfb0cc"/>
  <text x="1108" y="338" class="sans" font-size="16" font-weight="600" fill="#443c38" text-anchor="end">1</text>

  <text x="60" y="398" class="sans" font-size="14" fill="#8a817a">One vote per account, held by a compound unique index. Results come from a MongoDB aggregation pipeline.</text>
</svg>
