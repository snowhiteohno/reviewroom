<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Who can do what</title>
  <desc id="desc">View designs and feedback: owner yes, editor yes, reviewer yes; Comment and reply: owner yes, editor yes, reviewer yes; Upload revisions and link fixes: owner yes, editor yes, reviewer no; Request review or reopen a draft: owner yes, editor yes, reviewer no; Approve or request changes: owner yes, editor no, reviewer yes; Verify another person’s fix: owner yes, editor only if author, reviewer yes; Manage access or archive: owner yes, editor no, reviewer no; Start a blind vote: owner yes, editor yes, reviewer no; Vote once in a poll: owner yes, editor yes, reviewer yes; Close a poll: owner yes, editor only if creator, reviewer no. Nobody can verify their own fix. An owner, an editor or the author can resolve a suggestion. A must fix always needs a verified linked revision. Sharing sends no email. The teammate registers or signs in with the email you added. Removing someone cuts off their files and project actions immediately.</desc>
  <defs>
    <style>
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
      .sans { font-family: "Avenir Next", Avenir, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#c9a6ae" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="1160" height="540" rx="28" fill="#faf8f4" stroke="#e9e3db" stroke-width="2"/>
  <text x="60" y="88" class="serif" font-size="36" fill="#443c38">Who can do what<tspan fill="#a85968">.</tspan></text>
  <text x="60" y="120" class="sans" font-size="16" fill="#8a817a">Owners manage the project, editors build it, reviewers judge it.</text>
  <rect x="60" y="150" width="660" height="390" rx="16" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <text x="470" y="186" class="sans" font-size="11" fill="#a85968" font-weight="700" text-anchor="middle" letter-spacing="2">OWNER</text>
  <text x="565" y="186" class="sans" font-size="11" fill="#6f5a80" font-weight="700" text-anchor="middle" letter-spacing="2">EDITOR</text>
  <text x="660" y="186" class="sans" font-size="11" fill="#647960" font-weight="700" text-anchor="middle" letter-spacing="2">REVIEWER</text>
  <text x="84" y="227" class="sans" font-size="14" fill="#443c38">View designs and feedback</text>
  <circle cx="470" cy="222" r="7" fill="#a85968"/>
  <circle cx="565" cy="222" r="7" fill="#6f5a80"/>
  <circle cx="660" cy="222" r="7" fill="#647960"/>
  <line x1="84" y1="238" x2="696" y2="238" stroke="#e9e3db" stroke-width="1"/>
  <text x="84" y="259" class="sans" font-size="14" fill="#443c38">Comment and reply</text>
  <circle cx="470" cy="254" r="7" fill="#a85968"/>
  <circle cx="565" cy="254" r="7" fill="#6f5a80"/>
  <circle cx="660" cy="254" r="7" fill="#647960"/>
  <line x1="84" y1="270" x2="696" y2="270" stroke="#e9e3db" stroke-width="1"/>
  <text x="84" y="291" class="sans" font-size="14" fill="#443c38">Upload revisions and link fixes</text>
  <circle cx="470" cy="286" r="7" fill="#a85968"/>
  <circle cx="565" cy="286" r="7" fill="#6f5a80"/>
  <circle cx="660" cy="286" r="6" fill="none" stroke="#d9d1c8" stroke-width="2"/>
  <line x1="84" y1="302" x2="696" y2="302" stroke="#e9e3db" stroke-width="1"/>
  <text x="84" y="323" class="sans" font-size="14" fill="#443c38">Request review or reopen a draft</text>
  <circle cx="470" cy="318" r="7" fill="#a85968"/>
  <circle cx="565" cy="318" r="7" fill="#6f5a80"/>
  <circle cx="660" cy="318" r="6" fill="none" stroke="#d9d1c8" stroke-width="2"/>
  <line x1="84" y1="334" x2="696" y2="334" stroke="#e9e3db" stroke-width="1"/>
  <text x="84" y="355" class="sans" font-size="14" fill="#443c38">Approve or request changes</text>
  <circle cx="470" cy="350" r="7" fill="#a85968"/>
  <circle cx="565" cy="350" r="6" fill="none" stroke="#d9d1c8" stroke-width="2"/>
  <circle cx="660" cy="350" r="7" fill="#647960"/>
  <line x1="84" y1="366" x2="696" y2="366" stroke="#e9e3db" stroke-width="1"/>
  <text x="84" y="387" class="sans" font-size="14" fill="#443c38">Verify another person’s fix</text>
  <circle cx="470" cy="382" r="7" fill="#a85968"/>
  <text x="565" y="386" class="sans" font-size="12" fill="#6f5a80" font-weight="600" text-anchor="middle">if author</text>
  <circle cx="660" cy="382" r="7" fill="#647960"/>
  <line x1="84" y1="398" x2="696" y2="398" stroke="#e9e3db" stroke-width="1"/>
  <text x="84" y="419" class="sans" font-size="14" fill="#443c38">Manage access or archive</text>
  <circle cx="470" cy="414" r="7" fill="#a85968"/>
  <circle cx="565" cy="414" r="6" fill="none" stroke="#d9d1c8" stroke-width="2"/>
  <circle cx="660" cy="414" r="6" fill="none" stroke="#d9d1c8" stroke-width="2"/>
  <line x1="84" y1="430" x2="696" y2="430" stroke="#e9e3db" stroke-width="1"/>
  <text x="84" y="451" class="sans" font-size="14" fill="#443c38">Start a blind vote</text>
  <circle cx="470" cy="446" r="7" fill="#a85968"/>
  <circle cx="565" cy="446" r="7" fill="#6f5a80"/>
  <circle cx="660" cy="446" r="6" fill="none" stroke="#d9d1c8" stroke-width="2"/>
  <line x1="84" y1="462" x2="696" y2="462" stroke="#e9e3db" stroke-width="1"/>
  <text x="84" y="483" class="sans" font-size="14" fill="#443c38">Vote once in a poll</text>
  <circle cx="470" cy="478" r="7" fill="#a85968"/>
  <circle cx="565" cy="478" r="7" fill="#6f5a80"/>
  <circle cx="660" cy="478" r="7" fill="#647960"/>
  <line x1="84" y1="494" x2="696" y2="494" stroke="#e9e3db" stroke-width="1"/>
  <text x="84" y="515" class="sans" font-size="14" fill="#443c38">Close a poll</text>
  <circle cx="470" cy="510" r="7" fill="#a85968"/>
  <text x="565" y="514" class="sans" font-size="12" fill="#6f5a80" font-weight="600" text-anchor="middle">if creator</text>
  <circle cx="660" cy="510" r="6" fill="none" stroke="#d9d1c8" stroke-width="2"/>
  <rect x="744" y="150" width="396" height="390" rx="16" fill="#f5f1eb"/>
  <text x="768" y="186" class="sans" font-size="11" fill="#8a817a" font-weight="700" letter-spacing="2">GOOD TO KNOW</text>
  <circle cx="774" cy="221" r="4.5" fill="#a85968"/>
  <text x="790" y="226" class="sans" font-size="14" fill="#443c38">Nobody can verify their own fix.</text>
  <circle cx="774" cy="263" r="4.5" fill="#647960"/>
  <text x="790" y="268" class="sans" font-size="14" fill="#443c38">An owner, an editor or the author can</text>
  <text x="790" y="290" class="sans" font-size="14" fill="#443c38">resolve a suggestion. A must fix always</text>
  <text x="790" y="312" class="sans" font-size="14" fill="#443c38">needs a verified linked revision.</text>
  <circle cx="774" cy="349" r="4.5" fill="#6f5a80"/>
  <text x="790" y="354" class="sans" font-size="14" fill="#443c38">Sharing sends no email. The teammate</text>
  <text x="790" y="376" class="sans" font-size="14" fill="#443c38">registers or signs in with the email</text>
  <text x="790" y="398" class="sans" font-size="14" fill="#443c38">you added.</text>
  <circle cx="774" cy="435" r="4.5" fill="#a85968"/>
  <text x="790" y="440" class="sans" font-size="14" fill="#443c38">Removing someone cuts off their files</text>
  <text x="790" y="462" class="sans" font-size="14" fill="#443c38">and project actions immediately.</text>
</svg>
