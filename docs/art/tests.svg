<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="612" viewBox="0 0 1200 612" role="img" aria-labelledby="title desc">
  <title id="title">What the tests cover</title>
  <desc id="desc">npm test runs Supertest against a real MongoDB replica set in its own reviewroom_test database, checking the name before dropping only that database. It covers password hashing, session revocation, access control, private files, GridFS persistence, GridFS cleanup, concurrent uploads, feedback isolation, independent verification, approval races, blind voting, cross-project options, membership removal, idempotent samples. npm run test:ui needs npm run dev and Chrome with remote debugging; a designer and a reviewer in separate browser contexts cover registration, login and logout, uploads, sharing, linked fixes, approval blocking, verification, voting, keyboard slider, mobile layout, persistence after sign-in. CHROME_CDP_URL defaults to http://localhost:9222 and UI_BASE_URL to http://localhost:5174. Screenshots go to artifacts, test accounts use reviewroom.test emails, and their project is archived after a passing run.</desc>
