<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">How ReviewRoom works</title>
  <desc id="desc">A request flows from the React client to Express routes, through JWT session middleware, into controllers with Zod validation, then services that run MongoDB transactions, and finally MongoDB with Mongoose models and GridFS images.</desc>
  <defs>
    <style>
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
      .sans { font-family: "Avenir Next", Avenir, "Segoe UI", Helvetica, Arial, sans-serif; }
      .box { fill: #fffefa; stroke: #e9e3db; stroke-width: 2; }
      .name { font-size: 19px; fill: #443c38; }
      .tag { font-size: 10px; font-weight: 700; letter-spacing: 2px; }
      .note { font-size: 13px; fill: #8a817a; }
      .fact { font-size: 14px; fill: #443c38; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#c9a6ae" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1160" height="400" rx="28" fill="#faf8f4" stroke="#e9e3db" stroke-width="2"/>

  <text x="60" y="88" class="serif" font-size="36" fill="#443c38">How a request moves<tspan fill="#a85968">.</tspan></text>
  <text x="60" y="120" class="sans" font-size="16" fill="#8a817a">One Express server serves the React build and the API from the same origin.</text>

  <g stroke="#c9a6ae" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)">
    <line x1="224" y1="220" x2="240" y2="220"/>
    <line x1="408" y1="220" x2="424" y2="220"/>
    <line x1="592" y1="220" x2="608" y2="220"/>
    <line x1="776" y1="220" x2="792" y2="220"/>
    <line x1="960" y1="220" x2="976" y2="220"/>
  </g>

  <rect x="60" y="160" width="160" height="120" rx="16" class="box"/>
  <text x="78" y="186" class="sans tag" fill="#a85968">CLIENT</text>
  <text x="78" y="214" class="serif name">React</text>
  <text x="78" y="240" class="sans note">Vite, React Router</text>
  <text x="78" y="258" class="sans note">typed API adapter</text>

  <rect x="244" y="160" width="160" height="120" rx="16" class="box"/>
  <text x="262" y="186" class="sans tag" fill="#a85968">ROUTES</text>
  <text x="262" y="214" class="serif name">Express</text>
  <text x="262" y="240" class="sans note">origin checks</text>
  <text x="262" y="258" class="sans note">rate limits, Multer</text>

  <rect x="428" y="160" width="160" height="120" rx="16" class="box"/>
  <text x="446" y="186" class="sans tag" fill="#a85968">MIDDLEWARE</text>
  <text x="446" y="214" class="serif name">JWT session</text>
  <text x="446" y="240" class="sans note">HttpOnly cookie</text>
  <text x="446" y="258" class="sans note">live session record</text>

  <rect x="612" y="160" width="160" height="120" rx="16" class="box"/>
  <text x="630" y="186" class="sans tag" fill="#a85968">CONTROLLERS</text>
  <text x="630" y="214" class="serif name">Validation</text>
  <text x="630" y="240" class="sans note">Zod schemas</text>
  <text x="630" y="258" class="sans note">MVC folders</text>

  <rect x="796" y="160" width="160" height="120" rx="16" class="box"/>
  <text x="814" y="186" class="sans tag" fill="#a85968">SERVICES</text>
  <text x="814" y="214" class="serif name">Transactions</text>
  <text x="814" y="240" class="sans note">permissions</text>
  <text x="814" y="258" class="sans note">retry on conflict</text>

  <rect x="980" y="160" width="160" height="120" rx="16" fill="#e7ecdf" stroke="#647960" stroke-width="2"/>
  <text x="998" y="186" class="sans tag" fill="#647960">DATABASE</text>
  <text x="998" y="214" class="serif name">MongoDB</text>
  <text x="998" y="240" class="sans note" style="fill:#5b6b57">Mongoose models</text>
  <text x="998" y="258" class="sans note" style="fill:#5b6b57">GridFS images</text>

  <line x1="60" y1="312" x2="1140" y2="312" stroke="#e9e3db" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>

  <circle cx="72" cy="346" r="5" fill="#a85968"/>
  <text x="88" y="351" class="sans fact">Identity comes only from a verified</text>
  <text x="88" y="371" class="sans fact">JWT and a live, revocable session.</text>

  <circle cx="432" cy="346" r="5" fill="#647960"/>
  <text x="448" y="351" class="sans fact">Every change bumps the project revision</text>
  <text x="448" y="371" class="sans fact">inside a transaction, so races retry safely.</text>

  <circle cx="812" cy="346" r="5" fill="#6f5a80"/>
  <text x="828" y="351" class="sans fact">Images are private and served only</text>
  <text x="828" y="371" class="sans fact">after a project membership check.</text>
</svg>
