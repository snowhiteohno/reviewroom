<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">How ReviewRoom works</title>
  <desc id="desc">A request flows React (Vite, React Router, typed API adapter) → Express (origin checks, rate limits, Multer) → JWT session (HttpOnly cookie, live session record) → Validation (Zod schemas, MVC folders) → Transactions (permissions, retry on conflict) → MongoDB (Mongoose models, GridFS images). Identity: A verified JWT plus a live session record. Client headers ignored; logout revokes it. Data: Projects embed members. Versions, comments, polls, votes, favorites and activity point back. Consistency: Every change bumps the project revision in one transaction with its approval checks. Versions: A transaction-held counter and unique index number them. Failed writes delete the image. Files: Uploads live outside public paths and are served only after a membership check. Pins: Stored as 0–1 coordinates, so they stay put while the canvas resizes and zooms.</desc>
  <defs>
    <style>
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
      .sans { font-family: "Avenir Next", Avenir, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#c9a6ae" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="1160" height="480" rx="28" fill="#faf8f4" stroke="#e9e3db" stroke-width="2"/>
  <text x="60" y="88" class="serif" font-size="36" fill="#443c38">How a request moves<tspan fill="#a85968">.</tspan></text>
  <text x="60" y="120" class="sans" font-size="16" fill="#8a817a">One Express server serves the React build and the API from the same origin.</text>
  <rect x="60" y="160" width="160" height="120" rx="16" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <text x="78" y="186" class="sans" font-size="11" fill="#a85968" font-weight="700" letter-spacing="2">CLIENT</text>
  <text x="78" y="214" class="serif" font-size="19" fill="#443c38">React</text>
  <text x="78" y="240" class="sans" font-size="13" fill="#8a817a">Vite, React Router</text>
  <text x="78" y="258" class="sans" font-size="13" fill="#8a817a">typed API adapter</text>
  <line x1="224" y1="220" x2="240" y2="220" stroke="#c9a6ae" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="244" y="160" width="160" height="120" rx="16" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <text x="262" y="186" class="sans" font-size="11" fill="#a85968" font-weight="700" letter-spacing="2">ROUTES</text>
  <text x="262" y="214" class="serif" font-size="19" fill="#443c38">Express</text>
  <text x="262" y="240" class="sans" font-size="13" fill="#8a817a">origin checks</text>
  <text x="262" y="258" class="sans" font-size="13" fill="#8a817a">rate limits, Multer</text>
  <line x1="408" y1="220" x2="424" y2="220" stroke="#c9a6ae" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="428" y="160" width="160" height="120" rx="16" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <text x="446" y="186" class="sans" font-size="11" fill="#a85968" font-weight="700" letter-spacing="2">MIDDLEWARE</text>
  <text x="446" y="214" class="serif" font-size="19" fill="#443c38">JWT session</text>
  <text x="446" y="240" class="sans" font-size="13" fill="#8a817a">HttpOnly cookie</text>
  <text x="446" y="258" class="sans" font-size="13" fill="#8a817a">live session record</text>
  <line x1="592" y1="220" x2="608" y2="220" stroke="#c9a6ae" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="612" y="160" width="160" height="120" rx="16" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <text x="630" y="186" class="sans" font-size="11" fill="#a85968" font-weight="700" letter-spacing="2">CONTROLLERS</text>
  <text x="630" y="214" class="serif" font-size="19" fill="#443c38">Validation</text>
  <text x="630" y="240" class="sans" font-size="13" fill="#8a817a">Zod schemas</text>
  <text x="630" y="258" class="sans" font-size="13" fill="#8a817a">MVC folders</text>
  <line x1="776" y1="220" x2="792" y2="220" stroke="#c9a6ae" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="796" y="160" width="160" height="120" rx="16" fill="#fffefa" stroke="#e9e3db" stroke-width="2"/>
  <text x="814" y="186" class="sans" font-size="11" fill="#a85968" font-weight="700" letter-spacing="2">SERVICES</text>
  <text x="814" y="214" class="serif" font-size="19" fill="#443c38">Transactions</text>
  <text x="814" y="240" class="sans" font-size="13" fill="#8a817a">permissions</text>
  <text x="814" y="258" class="sans" font-size="13" fill="#8a817a">retry on conflict</text>
  <line x1="960" y1="220" x2="976" y2="220" stroke="#c9a6ae" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="980" y="160" width="160" height="120" rx="16" fill="#e7ecdf" stroke="#647960" stroke-width="2"/>
  <text x="998" y="186" class="sans" font-size="11" fill="#647960" font-weight="700" letter-spacing="2">DATABASE</text>
  <text x="998" y="214" class="serif" font-size="19" fill="#443c38">MongoDB</text>
  <text x="998" y="240" class="sans" font-size="13" fill="#5b6b57">Mongoose models</text>
  <text x="998" y="258" class="sans" font-size="13" fill="#5b6b57">GridFS images</text>
  <line x1="60" y1="312" x2="1140" y2="312" stroke="#e9e3db" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <text x="60" y="350" class="sans" font-size="11" fill="#a85968" font-weight="700" letter-spacing="2">IDENTITY</text>
  <text x="60" y="373" class="sans" font-size="14" fill="#443c38">A verified JWT plus a live session record.</text>
  <text x="60" y="393" class="sans" font-size="14" fill="#443c38">Client headers ignored; logout revokes it.</text>
  <text x="428" y="350" class="sans" font-size="11" fill="#a85968" font-weight="700" letter-spacing="2">DATA</text>
  <text x="428" y="373" class="sans" font-size="14" fill="#443c38">Projects embed members. Versions, comments,</text>
  <text x="428" y="393" class="sans" font-size="14" fill="#443c38">polls, votes, favorites and activity point back.</text>
  <text x="796" y="350" class="sans" font-size="11" fill="#647960" font-weight="700" letter-spacing="2">CONSISTENCY</text>
  <text x="796" y="373" class="sans" font-size="14" fill="#443c38">Every change bumps the project revision in</text>
  <text x="796" y="393" class="sans" font-size="14" fill="#443c38">one transaction with its approval checks.</text>
  <text x="60" y="432" class="sans" font-size="11" fill="#647960" font-weight="700" letter-spacing="2">VERSIONS</text>
  <text x="60" y="455" class="sans" font-size="14" fill="#443c38">A transaction-held counter and unique index</text>
  <text x="60" y="475" class="sans" font-size="14" fill="#443c38">number them. Failed writes delete the image.</text>
  <text x="428" y="432" class="sans" font-size="11" fill="#6f5a80" font-weight="700" letter-spacing="2">FILES</text>
  <text x="428" y="455" class="sans" font-size="14" fill="#443c38">Uploads live outside public paths and are</text>
  <text x="428" y="475" class="sans" font-size="14" fill="#443c38">served only after a membership check.</text>
  <text x="796" y="432" class="sans" font-size="11" fill="#6f5a80" font-weight="700" letter-spacing="2">PINS</text>
  <text x="796" y="455" class="sans" font-size="14" fill="#443c38">Stored as 0–1 coordinates, so they stay put</text>
  <text x="796" y="475" class="sans" font-size="14" fill="#443c38">while the canvas resizes and zooms.</text>
</svg>
