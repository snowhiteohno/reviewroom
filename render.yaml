services:
  - type: web
    name: reviewroom
    runtime: node
    plan: free
    repo: https://github.com/snowhiteohno/reviewroom
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.23.2"
      - key: HOST
        value: 0.0.0.0
      - key: UPLOAD_STORAGE
        value: gridfs
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
